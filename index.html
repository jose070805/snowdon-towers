<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101A32">
    <meta name="description" content="Snowdon Towers. A scroll-controlled architectural study from plan to exploded axonometric.">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/src/phase-one-type.css">
    <script type="module" src="/src/title-preview.js"></script>
    <title>Snowdon Towers — Architecture in Motion</title>
  </head>
  <body>
    <main id="sequence" aria-label="Snowdon Towers scrollable architectural study">
      <section class="stage" aria-label="Architectural 3-D stage">
        <div class="atmosphere" aria-hidden="true"></div>
        <div id="scene" role="img" aria-label="Snowdon Towers architectural model"></div>
        <div class="stage-grain" aria-hidden="true"></div>
        <div class="folio-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="drawing-sheet" aria-hidden="true">
        </div>
        <header class="masthead">
          <p>Architecture in Motion</p>
          <h1>Snowdon <em>Towers</em></h1>
        </header>
        <div class="viewstamp" aria-hidden="true">
          <span class="viewstamp__index">ST / ARCH</span>
          <span id="view-type">C101 / SITE PLAN</span>
        </div>
        <nav class="scale" aria-label="Scroll animation stages">
          <button type="button" data-stage="0" aria-label="00 site"></button>
          <button type="button" data-stage="1" aria-label="01 focus"></button>
          <button type="button" data-stage="2" aria-label="02 raising"></button>
          <button type="button" data-stage="3" aria-label="03 solid"></button>
          <button type="button" data-stage="4" aria-label="04 roof landscape"></button>
          <button type="button" data-stage="5" aria-label="05 street level"></button>
          <button type="button" data-stage="6" aria-label="06 elevations"></button>
          <button type="button" data-stage="7" aria-label="07 exploded analysis"></button>
        </nav>
        <div id="annotations" aria-hidden="true"></div>
        <div class="transport">
          <div class="transport__hint" lang="en"><span class="transport__wheel" aria-hidden="true"></span><span>SCROLL TO ADVANCE</span></div>
          <div class="transport__time"><span id="percent">00</span><span>%</span></div>
          <div class="transport__track" aria-hidden="true"><i id="progress"></i></div>
        </div>
        <div id="loading" class="loading" role="status" lang="en">LOADING GEOMETRY…</div>
      </section>
      <div class="scroll-space" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
